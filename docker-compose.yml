services:
  postgres:
    image: postgres:16-alpine
    container_name: ayudarnos_postgres
    restart: always
    environment:
      POSTGRES_DB: ayudarnos_db
      POSTGRES_USER: ayudarnos
      POSTGRES_PASSWORD: ayudarnos_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
