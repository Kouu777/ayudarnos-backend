spring.application.name=ayudarnos-api
server.port=8080

# PostgreSQL Database Configuration (default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ayudarnos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:ayudarnos}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:ayudarnos_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security Configuration (Secret key is a 256-bit+ secure hex string)
app.jwt.secret=9a6747f3b9785223093204f6e4a4683404e12e34c6613c88344e672f914041114b3010f140228301e28770a72f339ecf7b8893a2e6d241565478273643847aa1
app.jwt.expiration-ms=86400000

# CORS Configuration
app.cors.allowed-origins=*

logging.level.cl.ayudarnos=INFO
